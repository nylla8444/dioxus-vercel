[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.dioxus-vercel]
project = "dioxus-vercel-demo"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
