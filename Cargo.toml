[package]
name = "dioxus-vercel"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "Build a Dioxus web app and deploy it to Vercel as a prebuilt static site"
license = "MIT"
repository = "https://github.com/nylla8444/dioxus-vercel"
readme = "README.md"
keywords = ["dioxus", "vercel", "wasm", "deploy", "cli"]
categories = ["command-line-utilities", "wasm", "web-programming"]
# The demo app and this repo's own workflow aren't part of the tool.
exclude = ["/examples", "/.github"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the order of settings in a user's vercel.json.
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
which = "8"

[dev-dependencies]
regex = "1"
