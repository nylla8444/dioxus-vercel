# Builds the Dioxus CLI (dx) on Amazon Linux 2023, the system Vercel's build
# machines run. DioxusLabs' Linux builds of dx need glibc 2.35 or newer, and
# Vercel's machines have 2.34, so their dx can't run there. dioxus-vercel
# downloads these builds when it runs on Vercel.
#
# Once a day, and whenever this file changes, it builds every dioxus-cli
# version from 0.7.0 on that has no dx-<version> release yet: stable versions,
# plus pre-releases newer than the newest stable one. Pushing a dx-<version>
# tag builds just that version.
name: Build dx for Vercel

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/build-dx.yml"]
    tags: ["dx-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.missing.outputs.versions }}
    steps:
      - name: Find versions without a build
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/dx-* ]]; then
            echo "versions=[\"${GITHUB_REF_NAME#dx-}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '[.[].tagName]')
          versions=$(curl -fsSL -A "dioxus-vercel build-dx (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/dioxus-cli/versions?per_page=100&sort=semver" |
            jq -c --argjson existing "$existing" '
              def minor: split(".")[0:2] | map(tonumber? // 0);
              [.versions[] | select(.yanked | not) | .num] as $all
              | ($all | map(select(contains("-") | not) | minor) | max) as $newest
              | $all | map(select(
                  (minor >= [0, 7])
                  and ((contains("-") | not) or (minor > $newest))
                  and (("dx-" + .) as $tag | $existing | any(. == $tag) | not)
                ))')
          echo "Versions to build: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - name: Install build tools
        run: dnf install -y gcc gcc-c++ make perl openssl-devel pkgconf-pkg-config binutils tar gzip findutils

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Build dx
        run: '"$HOME/.cargo/bin/cargo" install dioxus-cli --version "$VERSION" --locked --root out'

      - name: Check that it runs and which glibc it needs
        run: |
          out/bin/dx --version
          ldd --version | head -1
          echo "newest glibc symbol dx uses: $(objdump -T out/bin/dx | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"

      # dx is MIT OR Apache-2.0, so its license files ship with the binary.
      - name: Package
        run: |
          name="dx-$VERSION-x86_64-amazonlinux2023"
          mkdir "$name"
          cp out/bin/dx "$name/"
          for license in LICENSE-MIT LICENSE-APACHE; do
            curl -fsSL -o "$name/$license" "https://raw.githubusercontent.com/DioxusLabs/dioxus/v$VERSION/$license"
          done
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dx-${{ matrix.version }}
          path: dx-*.tar.gz*

  release:
    needs: [plan, build]
    # Runs for the versions that built, even if others failed.
    if: ${{ !cancelled() && needs.plan.outputs.versions != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        id: download
        # Missing when this version's build failed.
        continue-on-error: true
        with:
          name: dx-${{ matrix.version }}

      # --latest=false keeps the tool's own release as the repo's latest.
      - name: Publish the release
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          flags=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "dx-$VERSION" dx-*.tar.gz* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dx $VERSION for Vercel builds" \
            "${flags[@]}" \
            --notes "The Dioxus CLI (dx) $VERSION, built on Amazon Linux 2023 so it runs on Vercel's build machines (glibc 2.34). It's an unmodified build of dioxus-cli $VERSION from crates.io, licensed MIT OR Apache-2.0 by DioxusLabs; the license files are in the archive."
